<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f4eee4"><title>Prédio Legal | Início</title><style>
:root{--ink:#102042;--copper:#b97837;--paper:#f4eee4;--grey:#77736f}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:Arial,sans-serif;background:var(--paper)}body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.13;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 140 140' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.6' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.2'/%3E%3C/svg%3E")}button,input{font:inherit}header{height:90px;display:flex;align-items:center;justify-content:center;position:relative;max-width:700px;margin:auto}.logo{font-weight:900;font-size:29px;letter-spacing:-1.8px;white-space:nowrap}.logo .dot{color:var(--copper)}.logo .document{font-size:21px;vertical-align:2px}.profile{position:absolute;right:23px;top:28px;border:1.5px solid var(--copper);color:var(--copper);background:transparent;border-radius:50%;width:36px;height:36px;font-size:24px}.wrap{max-width:700px;margin:auto;padding:18px 23px 120px}.hero{min-height:193px;position:relative}.hero:after{content:"";position:absolute;right:0;bottom:0;width:48%;height:110px;opacity:.18;background:repeating-linear-gradient(90deg,transparent 0 18px,#9e9b91 19px 20px,transparent 21px 43px),linear-gradient(0deg,#a8a49a,transparent);clip-path:polygon(0 100%,0 65%,16% 65%,16% 40%,38% 40%,38% 12%,59% 12%,59% 40%,79% 40%,79% 0,100% 0,100% 100%);z-index:-1}.hero .hello{font:26px Georgia,serif;color:#77736f}.hero h1{font:40px/1.12 Georgia,serif;letter-spacing:-.6px;margin:3px 0 20px}.search{width:100%;border:0;border-radius:40px;background:#ffffff9c;box-shadow:0 5px 20px #5b48301b;padding:18px 20px;color:var(--ink);font-size:15px}.section{margin-top:39px}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}.section h2{font:27px Georgia,serif;margin:0}.more{background:none;border:0;color:#a56c39;font:17px Georgia,serif;white-space:nowrap}.job{width:100%;border:0;background:#ffffff7a;display:flex;gap:13px;align-items:center;text-align:left;padding:10px;border-radius:12px;margin:9px 0;min-height:91px;color:var(--ink)}.thumb{width:110px;height:76px;flex:none;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#d9d2c6;color:#766b61}.jobtext{flex:1;min-width:0}.eyebrow{font-size:10px;letter-spacing:1px;color:var(--grey);text-transform:uppercase}.jobname{font:19px Georgia,serif;margin:6px 0}.detail{font-size:12px;color:var(--grey)}.arrow{font-size:24px;color:var(--copper)}.albums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.album .photo{height:104px;border-radius:10px;background:#ddd5c8;display:flex;align-items:center;justify-content:center;font-size:30px}.album strong{display:block;font:16px Georgia,serif;margin:8px 0 4px}.album small{font-size:10px;color:var(--grey)}nav{position:fixed;bottom:0;left:0;right:0;background:#f4eee4f5;border-top:1px solid #d6cfc4;padding:10px 10px calc(9px + env(safe-area-inset-bottom))}.navinner{max-width:700px;margin:auto;display:grid;grid-template-columns:repeat(5,1fr)}.navbtn{border:0;background:none;color:#686867;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:5px}.navbtn .ico{font-size:25px}.navbtn.active{color:var(--copper)}.toast{display:none;position:fixed;bottom:93px;left:50%;transform:translateX(-50%);background:var(--ink);color:white;padding:12px 15px;border-radius:8px;font-size:12px;white-space:nowrap}.toast.show{display:block}@media(max-width:380px){.logo{font-size:24px}.hero h1{font-size:34px}.thumb{width:85px}.album .photo{height:75px}.album strong{font-size:13px}}
</style></head><body><header><div class="logo" aria-label="Prédio Legal">prédio<span class="dot">.</span>legal<span class="document">📄</span></div><button class="profile" data-action="Perfil" aria-label="Perfil">♙</button></header><main class="wrap"><section class="hero"><div class="hello">Bom dia,</div><h1>Vamos continuar<br>de onde parou?</h1></section><input class="search" placeholder="⌕  Buscar clientes, jobs, álbuns..." aria-label="Busca demonstrativa"><section class="section"><div class="sectionhead"><h2>Trabalhos recentes</h2><button class="more" data-action="Trabalhos">Ver todos ›</button></div><button class="job" data-action="Reparo de fachada"><div class="thumb">▥</div><div class="jobtext"><div class="eyebrow">Exemplo · Ed. Solar das Acácias</div><div class="jobname">Reparo de fachada</div><div class="detail">3 álbuns · Demonstração</div></div><span class="arrow">›</span></button><button class="job" data-action="Vistoria técnica"><div class="thumb">⌂</div><div class="jobtext"><div class="eyebrow">Exemplo · Cond. Villa Lobos</div><div class="jobname">Vistoria técnica</div><div class="detail">2 álbuns · Demonstração</div></div><span class="arrow">›</span></button><button class="job" data-action="Impermeabilização"><div class="thumb">▤</div><div class="jobtext"><div class="eyebrow">Exemplo · Ed. Monte Verde</div><div class="jobname">Impermeabilização cobertura</div><div class="detail">4 álbuns · Demonstração</div></div><span class="arrow">›</span></button></section><section class="section"><div class="sectionhead"><h2>Álbuns recentes</h2><button class="more" data-action="Álbuns">Ver todos ›</button></div><div class="albums"><div class="album"><div class="photo">▥</div><strong>Fachada norte</strong><small>Exemplo</small></div><div class="album"><div class="photo">╱</div><strong>Trincas</strong><small>Exemplo</small></div><div class="album"><div class="photo">▤</div><strong>Cobertura</strong><small>Exemplo</small></div><div class="album"><div class="photo">♧</div><strong>Instalações</strong><small>Exemplo</small></div></div></section></main><nav><div class="navinner"><button class="navbtn active" data-action="Início"><span class="ico">⌂</span>Início</button><button class="navbtn" data-action="Clientes"><span class="ico">♙</span>Clientes</button><button class="navbtn" data-action="Jobs"><span class="ico">▱</span>Jobs</button><button class="navbtn" data-action="Álbuns"><span class="ico">▧</span>Álbuns</button><button class="navbtn" data-action="Mais"><span class="ico">•••</span>Mais</button></div></nav><div class="toast" role="status"></div><script>let t;document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>{let e=document.querySelector('.toast');e.textContent=b.dataset.action+' · disponível em breve';e.classList.add('show');clearTimeout(t);t=setTimeout(()=>e.classList.remove('show'),2200)}));document.querySelector('.search').addEventListener('input',e=>{if(e.target.value){let x=document.querySelector('.toast');x.textContent='Busca disponível em breve';x.classList.add('show');clearTimeout(t);t=setTimeout(()=>x.classList.remove('show'),2200)}});</script></body></html>
