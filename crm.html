<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prédio Legal · Contatos</title><script src="pl-theme.js"></script><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--paper:#f5f0e7;--ink:#142642;--muted:#918a7f;--line:#e2d9cc;--accent:#a97a4c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'Instrument Sans',sans-serif}main{max-width:780px;margin:auto;padding:24px 20px 100px}a{color:var(--accent);text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:29px}h1{font-size:26px;font-weight:500;letter-spacing:-.04em;margin:0}small,.muted{color:var(--muted)}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.top small{display:block;margin-top:6px}.btn{border:1px solid var(--line);background:transparent;border-radius:22px;padding:10px 15px;color:var(--ink);font:inherit;cursor:pointer}.primary{background:var(--ink);color:white;border-color:var(--ink)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff9;color:var(--ink);padding:12px;font:inherit;outline-color:var(--accent)}.search{margin:24px 0 12px;border-radius:25px}.filters{display:flex;gap:7px;margin-bottom:12px;overflow-x:auto;white-space:nowrap;scrollbar-width:none}.filters::-webkit-scrollbar{display:none}.vinculo{display:flex;gap:8px;align-items:center;margin:8px 0}.vinculo input,.vinculo select{min-width:0}.vinculo button{flex-shrink:0}.item .case{font-size:12px;color:var(--muted);display:block;margin-top:4px}.filters button{border:0;background:transparent;padding:7px 10px;color:var(--muted);cursor:pointer}.filters .on{color:var(--ink);border-bottom:1px solid var(--accent)}.item{display:flex;align-items:center;gap:12px;padding:15px 3px;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit}.avatar{width:40px;height:40px;border-radius:50%;background:#e6ddcf;display:grid;place-items:center;color:#7c6654;font-weight:600;flex-shrink:0}.item-body{flex:1;min-width:0}.item b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item span{font-size:12px;color:var(--muted);display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arrow{font-size:22px;color:var(--accent)}dialog{border:1px solid var(--line);border-radius:17px;padding:22px;background:var(--paper);color:var(--ink);width:min(96vw,520px);max-height:88vh}dialog::backdrop{background:#10203e9c}form{display:grid;gap:12px}label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:9px}.error{color:#a33b32;font-size:12px}.empty{padding:35px 0;color:var(--muted)}@media(prefers-color-scheme:dark){body:not(.light){--paper:#07182e;--ink:#f3eee4;--muted:#b2a99b;--line:#36445a;--accent:#d0a37c}.avatar{background:#243650;color:#dfc7ac}input,textarea,select{background:#ffffff0b}}body[data-theme="light"]{--paper:#f5f0e7;--ink:#142642;--muted:#918a7f;--line:#e2d9cc;--accent:#a97a4c}body.embedded main{padding:0 8px 30px}body.embedded header{display:none}body.embedded .top{margin-top:2px}</style></head><body><main><header><a href="index.html">← Voltar ao aplicativo</a><small>PRÉDIO LEGAL</small></header><div class="top"><div><h1>Contatos</h1><small id="count">Carregando cadastro…</small></div><div style="display:flex;gap:6px;align-items:center"><button class="btn" id="import-vcf" type="button">Importar contato</button><input id="vcf-file" type="file" accept=".vcf,.vcard,text/vcard,text/x-vcard,application/octet-stream" style="display:none"><button class="btn primary" id="new">+ Novo</button></div></div><input class="search" id="search" placeholder="Buscar pessoa, função, empreendimento ou empresa" aria-label="Buscar contatos"><div class="filters"><button class="on" data-filter="ativos">Contatos</button><button data-filter="revisar">A revisar</button><button data-filter="arquivados">Arquivados</button></div><div class="filters" id="category-filters"><button class="on" data-category="todos">Todos</button><button data-category="sindicos">Síndicos</button><button data-category="advogados">Advogados</button><button data-category="engenharia">Eng./Arquitetos</button><button data-category="fornecedores">Fornecedores</button><button data-category="outros">Outros</button></div><div id="list"></div><p class="error" id="status"></p></main><dialog id="editor"><form id="form"><h2 id="editor-title" style="font-size:20px;font-weight:500;margin:0 0 5px">Editar contato</h2><label>Nome<input name="nome" required maxlength="200"></label><label>E-mail<input name="email" type="email"></label><label>Telefone<input name="telefone"></label><label>Profissão / função<input name="profissao"></label><label>Categoria profissional<select name="categoria_profissional"><option value="">Não classificado</option><option value="sindicos">Síndicos</option><option value="advogados">Advogados</option><option value="engenharia">Engenheiros / Arquitetos</option><option value="fornecedores">Fornecedores</option><option value="outros">Outros</option></select></label><label>Organização<input name="organizacao_texto"></label><label>Empreendimento / job<input name="empreendimento_texto"></label><label>Vínculos profissionais (função + empreendimento/caso)<div id="vinculos"></div><button class="btn" type="button" id="add-vinculo">+ Adicionar vínculo</button></label><label>Observações<textarea name="observacoes" rows="4"></textarea></label><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" name="revisao_pendente" style="width:auto">Pendente de revisão</label><p class="error" id="form-error"></p><div class="actions"><button class="btn" type="button" id="archive">Arquivar</button><div><button class="btn" type="button" id="cancel">Cancelar</button> <button class="btn primary" type="submit">Salvar</button></div></div></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
(async function () {
  const el = id => document.getElementById(id);
  const safe = value => String(value ?? '').replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const isEmbedded = new URLSearchParams(location.search).has('embed');
  if (isEmbedded) { document.body.classList.add('embedded'); document.querySelector('header')?.remove(); }
  let records = [], links = [], selected = null, statusFilter = 'ativos', category = 'todos';
  const fields = ['nome','email','telefone','profissao','organizacao_texto','empreendimento_texto','observacoes','categoria_profissional'];
  const showError = message => { el('count').textContent = 'Falha ao carregar contatos'; el('status').textContent = message; };
  if (!window.supabase?.createClient) { showError('Biblioteca Supabase indisponível. Verifique a conexão e recarregue.'); return; }
  const db = window.supabase.createClient('https://tqjjncxeiskqlzfjgnfd.supabase.co','sb_publishable_54qcYhkY_PIAL4NXI9IV_Q_kwWJAyaO');
  function groupOf(r) {
    if (r.categoria_profissional) return r.categoria_profissional;
    const value = [r.profissao, ...links.filter(v=>v.contato_id===r.id).map(v=>v.funcao)].join(' ').toLowerCase();
    if (/síndic|sindic/.test(value)) return 'sindicos';
    if (/advogad|juridic|jurídic/.test(value)) return 'advogados';
    if (/engenheir|arquitet/.test(value)) return 'engenharia';
    if (/forneced|serralheir|marmorari|empreiteir|marcen|eletricist|encanad|pintor|vidraç/.test(value)) return 'fornecedores';
    return 'outros';
  }
  function render() {
    const q = el('search').value.toLocaleLowerCase('pt-BR');
    const visible = records.filter(r => {
      if (statusFilter==='arquivados' ? !r.arquivado_em : !!r.arquivado_em) return false;
      if (statusFilter==='revisar' && !r.revisao_pendente) return false;
      if (category!=='todos' && groupOf(r)!==category) return false;
      const values=[r.nome,r.email,r.profissao,r.organizacao_texto,r.empreendimento_texto,...links.filter(v=>v.contato_id===r.id).flatMap(v=>[v.funcao,v.caso_nome])];
      return values.some(v=>String(v||'').toLocaleLowerCase('pt-BR').includes(q));
    });
    el('count').textContent = records.filter(r=>!r.arquivado_em).length+' contatos cadastrados';
    el('list').innerHTML = visible.map(r=>{
      const associated=links.filter(v=>v.contato_id===r.id);
      const details=associated.length ? associated.map(v=>'<span>'+safe(v.funcao)+' · '+safe(v.caso_nome)+'</span>').join('') : '<span>'+safe([r.profissao,r.empreendimento_texto].filter(Boolean).join(' · ')||r.organizacao_texto||'Função e casos a identificar')+'</span>';
      return '<button class="item" data-id="'+safe(r.id)+'"><div class="avatar">'+safe((r.nome||'?').charAt(0).toUpperCase())+'</div><div class="item-body"><b>'+safe(r.nome)+'</b>'+details+'</div><div class="arrow">›</div></button>';
    }).join('') || '<div class="empty">Nenhum contato nesta seleção.</div>';
  }
  function addLink(v={}) {
    const row=document.createElement('div');row.className='vinculo';
    row.innerHTML='<input class="vf" placeholder="Função" aria-label="Função"><input class="vc" placeholder="Empreendimento / caso" aria-label="Caso"><button class="btn" type="button">×</button>';
    row.querySelector('.vf').value=v.funcao||'';
    row.querySelector('.vc').value=v.caso_nome||'';
    row.querySelector('button').onclick=()=>row.remove();
    el('vinculos').append(row);
  }
  function edit(r) {
    selected=r||null;
    el('editor-title').textContent=r?'Editar contato':'Novo contato';
    fields.forEach(k=>el('form').elements[k].value=r?.[k]||'');
    el('form').elements.revisao_pendente.checked=!!r?.revisao_pendente;
    el('vinculos').innerHTML='';
    if(r)links.filter(v=>v.contato_id===r.id).forEach(addLink);
    el('archive').style.display=r?'block':'none';
    el('archive').textContent=r?.arquivado_em?'Restaurar':'Arquivar';
    el('form-error').textContent='';
    el('editor').showModal();
  }
  async function load() {
    el('count').textContent='Carregando contatos…';
    const {data,error}=await db.from('contatos').select('*').order('nome').limit(1000);
    if(error){showError('Supabase: '+error.message);return;}
    records=data||[];
    const result=await db.from('contato_vinculos').select('*').limit(5000);
    links=result.data||[];
    if(result.error)el('status').textContent='Vínculos: '+result.error.message;
    render();
  }
  el('search').addEventListener('input',render);
  document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
    statusFilter=b.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));
    render();
  }));
  document.querySelectorAll('[data-category]').forEach(b=>b.addEventListener('click',()=>{
    category=b.dataset.category;
    document.querySelectorAll('[data-category]').forEach(x=>x.classList.toggle('on',x===b));
    render();
  }));
  el('list').addEventListener('click',event=>{const b=event.target.closest('[data-id]');if(b)edit(records.find(r=>r.id===b.dataset.id));});
  el('new').onclick=()=>edit(null);
  el('import-vcf').onclick=async()=>{ 
    if ('contacts' in navigator && typeof navigator.contacts.select==='function') {
      try {
        const picked=await navigator.contacts.select(['name','email','tel'],{multiple:false});
        const person=picked?.[0];if(!person)return;
        const name=person.name?.[0]||'',email=person.email?.[0]||'',phone=person.tel?.[0]||'';
        const duplicate=records.find(r=>(email&&r.email?.toLowerCase()===email.toLowerCase())||(phone&&r.telefone&&r.telefone.replace(/\\D/g,'')===phone.replace(/\\D/g,'')));
        if(duplicate){edit(duplicate);return;}
        edit(null);const f=el('form').elements;f.nome.value=name;f.email.value=email;f.telefone.value=phone;f.revisao_pendente.checked=true;el('editor-title').textContent='Revisar contato importado';return;
      }catch(err){if(err.name==='AbortError')return;console.warn('Seletor de contatos:',err);}
    }
    el('vcf-file').click();
  };
  el('vcf-file').addEventListener('change',async event=>{
    const file=event.target.files?.[0];event.target.value='';
    if(!file)return;
    if(file.size>1024*1024){alert('Arquivo VCF muito grande. Importe um contato por vez.');return;}
    const raw=await file.text();
    const unfolded=raw.replace(/\r?\n[ \t]/g,'');
    const cards=unfolded.match(/BEGIN:VCARD[\s\S]*?END:VCARD/gi)||[];
    if(cards.length!==1){alert('Selecione um VCF com apenas um contato.');return;}
    const lines=cards[0].split(/\r?\n/);
    const get=(key)=>{const line=lines.find(x=>new RegExp('^'+key+'(?:;[^:]*)?:','i').test(x));return line?line.slice(line.indexOf(':')+1).replace(/\\n/gi,'\n').replace(/\\([,;\\])/g,'$1').trim():'';};
    const name=get('FN')||get('N').split(';').filter(Boolean).reverse().join(' ');
    const email=get('EMAIL'),phone=get('TEL'),org=get('ORG').replace(/;/g,' · '),job=get('TITLE');
    if(!name){alert('O VCF não contém um nome reconhecível.');return;}
    const duplicate=records.find(r=>(email&&r.email?.toLowerCase()===email.toLowerCase())||(phone&&r.telefone&&r.telefone.replace(/\D/g,'')===phone.replace(/\D/g,'')));
    if(duplicate){if(!confirm('Contato possivelmente já cadastrado: '+duplicate.nome+'. Abrir para revisar sem sobrescrever os dados?'))return;edit(duplicate);return;}
    edit(null);
    const f=el('form').elements;
    f.nome.value=name;f.email.value=email;f.telefone.value=phone;f.organizacao_texto.value=org;f.profissao.value=job;
    f.revisao_pendente.checked=true;
    el('editor-title').textContent='Revisar contato importado';
  });

  el('cancel').onclick=()=>el('editor').close();
  el('add-vinculo').onclick=()=>addLink();
  el('form').onsubmit=async event=>{
    event.preventDefault();
    const payload=Object.fromEntries(fields.map(k=>[k,el('form').elements[k].value.trim()||null]));
    payload.revisao_pendente=el('form').elements.revisao_pendente.checked;
    let savedId=selected?.id;
    const response=savedId ? await db.from('contatos').update(payload).eq('id',savedId).select('id').single() : await db.from('contatos').insert(payload).select('id').single();
    if(response.error){el('form-error').textContent=response.error.message;return;}
    savedId=response.data.id;
    const entries=[...el('vinculos').querySelectorAll('.vinculo')].map(row=>({contato_id:savedId,funcao:row.querySelector('.vf').value.trim(),caso_nome:row.querySelector('.vc').value.trim()})).filter(v=>v.funcao&&v.caso_nome);
    const removal=await db.from('contato_vinculos').delete().eq('contato_id',savedId);
    if(removal.error){el('form-error').textContent=removal.error.message;return;}
    if(entries.length){const insertion=await db.from('contato_vinculos').insert(entries);if(insertion.error){el('form-error').textContent=insertion.error.message;return;}}
    el('editor').close();await load();
  };
  el('archive').onclick=async()=>{
    if(!selected)return;
    const restore=!!selected.arquivado_em;
    if(!restore&&!confirm('Arquivar este contato?'))return;
    const {error}=await db.from('contatos').update({arquivado_em:restore?null:new Date().toISOString()}).eq('id',selected.id);
    if(error){el('form-error').textContent=error.message;return;}
    el('editor').close();await load();
  };
  try {
    const {data,error}=await db.auth.getSession();
    if(error)throw error;
    if(!data.session){showError('Sessão não encontrada. Entre com Google na página inicial e abra Contatos novamente.');return;}
    await load();
  } catch(e) { showError('Inicialização: '+(e?.message||String(e))); }
})();
</script></body></html>
