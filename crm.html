<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prédio Legal · Contatos</title><script src="pl-theme.js"></script><link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"><style>:root{--paper:#f5f0e7;--ink:#142642;--muted:#918a7f;--line:#e2d9cc;--accent:#a97a4c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px 'Instrument Sans',sans-serif}main{max-width:780px;margin:auto;padding:24px 20px 100px}a{color:var(--accent);text-decoration:none}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:29px}h1{font-size:26px;font-weight:500;letter-spacing:-.04em;margin:0}small,.muted{color:var(--muted)}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.top small{display:block;margin-top:6px}.btn{border:1px solid var(--line);background:transparent;border-radius:22px;padding:10px 15px;color:var(--ink);font:inherit;cursor:pointer}.primary{background:var(--ink);color:white;border-color:var(--ink)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff9;color:var(--ink);padding:12px;font:inherit;outline-color:var(--accent)}.search{margin:24px 0 12px;border-radius:25px}.filters{display:flex;gap:7px;margin-bottom:12px}.filters button{border:0;background:transparent;padding:7px 10px;color:var(--muted);cursor:pointer}.filters .on{color:var(--ink);border-bottom:1px solid var(--accent)}.item{display:flex;align-items:center;gap:12px;padding:15px 3px;border-bottom:1px solid var(--line);cursor:pointer;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit}.avatar{width:40px;height:40px;border-radius:50%;background:#e6ddcf;display:grid;place-items:center;color:#7c6654;font-weight:600;flex-shrink:0}.item-body{flex:1;min-width:0}.item b{display:block;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item span{font-size:12px;color:var(--muted);display:block;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.arrow{font-size:22px;color:var(--accent)}dialog{border:1px solid var(--line);border-radius:17px;padding:22px;background:var(--paper);color:var(--ink);width:min(96vw,520px);max-height:88vh}dialog::backdrop{background:#10203e9c}form{display:grid;gap:12px}label{display:grid;gap:5px;font-size:12px;color:var(--muted)}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:9px}.error{color:#a33b32;font-size:12px}.empty{padding:35px 0;color:var(--muted)}@media(prefers-color-scheme:dark){body:not(.light){--paper:#07182e;--ink:#f3eee4;--muted:#b2a99b;--line:#36445a;--accent:#d0a37c}.avatar{background:#243650;color:#dfc7ac}input,textarea,select{background:#ffffff0b}}body[data-theme="light"]{--paper:#f5f0e7;--ink:#142642;--muted:#918a7f;--line:#e2d9cc;--accent:#a97a4c}</style></head><body><main><header><a href="index.html">← Voltar ao aplicativo</a><small>PRÉDIO LEGAL</small></header><div class="top"><div><h1>Contatos</h1><small id="count">Carregando cadastro…</small></div><button class="btn primary" id="new">+ Novo</button></div><input class="search" id="search" placeholder="Buscar nome, e-mail, empresa ou empreendimento" aria-label="Buscar contatos"><div class="filters"><button class="on" data-filter="ativos">Contatos</button><button data-filter="revisar">A revisar</button><button data-filter="arquivados">Arquivados</button></div><div id="list"></div><p class="error" id="status"></p></main><dialog id="editor"><form id="form"><h2 id="editor-title" style="font-size:20px;font-weight:500;margin:0 0 5px">Editar contato</h2><label>Nome<input name="nome" required maxlength="200"></label><label>E-mail<input name="email" type="email"></label><label>Telefone<input name="telefone"></label><label>Profissão / função<input name="profissao"></label><label>Organização<input name="organizacao_texto"></label><label>Empreendimento / job<input name="empreendimento_texto"></label><label>Observações<textarea name="observacoes" rows="4"></textarea></label><label style="display:flex;align-items:center;gap:9px"><input type="checkbox" name="revisao_pendente" style="width:auto">Pendente de revisão</label><p class="error" id="form-error"></p><div class="actions"><button class="btn" type="button" id="archive">Arquivar</button><div><button class="btn" type="button" id="cancel">Cancelar</button> <button class="btn primary" type="submit">Salvar</button></div></div></form></dialog><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>(async()=>{const db=window.supabase.createClient('https://tqjjncxeiskqlzfjgnfd.supabase.co','sb_publishable_54qcYhkY_PIAL4NXI9IV_Q_kwWJAyaO');const $=s=>document.querySelector(s);let records=[],selected=null,filter='ativos';const safe=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fields=['nome','email','telefone','profissao','organizacao_texto','empreendimento_texto','observacoes'];const {data:{session}}=await db.auth.getSession();if(!session){$('#count').textContent='Entre na sua conta para acessar os contatos.';$('#new').disabled=true;return;}async function load(){const {data,error}=await db.from('contatos').select('*').order('nome',{ascending:true}).limit(1000);if(error){$('#status').textContent='Não foi possível carregar o CRM: '+error.message;return;}records=data||[];render();}function render(){let q=$('#search').value.toLocaleLowerCase('pt-BR');let items=records.filter(r=>(filter==='arquivados'?!!r.arquivado_em:!r.arquivado_em)&&(filter!=='revisar'||r.revisao_pendente)&&[r.nome,r.email,r.profissao,r.organizacao_texto,r.empreendimento_texto].some(v=>String(v||'').toLocaleLowerCase('pt-BR').includes(q)));$('#count').textContent=records.filter(r=>!r.arquivado_em).length+' contatos cadastrados';$('#list').innerHTML=items.length?items.map(r=>'<button class="item" data-id="'+r.id+'"><div class="avatar">'+safe((r.nome||'?').slice(0,1).toUpperCase())+'</div><div class="item-body"><b>'+safe(r.nome)+'</b><span>'+safe([r.profissao,r.organizacao_texto,r.email].filter(Boolean).join(' · '))+'</span></div><div class="arrow">›</div></button>').join(''):'<div class="empty">Nenhum contato encontrado.</div>';}function edit(r){selected=r||null;$('#editor-title').textContent=r?'Editar contato':'Novo contato';fields.forEach(k=>$('#form').elements[k].value=r?.[k]||'');$('#form').elements.revisao_pendente.checked=!!r?.revisao_pendente;$('#archive').style.display=r?'block':'none';$('#archive').textContent=r?.arquivado_em?'Restaurar':'Arquivar';$('#form-error').textContent='';$('#editor').showModal();}$('#list').onclick=e=>{let b=e.target.closest('[data-id]');if(b)edit(records.find(r=>r.id===b.dataset.id));};$('#new').onclick=()=>edit(null);$('#cancel').onclick=()=>$('#editor').close();$('#search').oninput=render;document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('on',x===b));render()});$('#form').onsubmit=async e=>{e.preventDefault();let payload=Object.fromEntries(fields.map(k=>[k,$('#form').elements[k].value.trim()||null]));payload.revisao_pendente=$('#form').elements.revisao_pendente.checked;let query=selected?db.from('contatos').update(payload).eq('id',selected.id):db.from('contatos').insert(payload);let {error}=await query;if(error){$('#form-error').textContent=error.message;return;}$('#editor').close();await load();};$('#archive').onclick=async()=>{if(!selected)return;let restore=!!selected.arquivado_em;if(!restore&&!confirm('Arquivar este contato? Ele poderá ser restaurado depois.'))return;let {error}=await db.from('contatos').update({arquivado_em:restore?null:new Date().toISOString()}).eq('id',selected.id);if(error){$('#form-error').textContent=error.message;return;}$('#editor').close();await load();};await load();})();</script></body></html>
